name: heybuddy_flutter
description: HeyBuddy Desktop Notifier - Native Flutter Version
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP 服务器
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  # 窗口控制 (置顶、隐藏、无边框)
  window_manager: ^0.3.9
  # 系统托盘
  system_tray: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
