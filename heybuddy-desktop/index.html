<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HeyBuddy</title>
    <style>
        :root {
            --bg-color: rgba(255, 255, 255, 0.95);
            --text-color: #202124;
            --border-color: rgba(0, 0, 0, 0.08);
            --hover-bg: rgba(0, 0, 0, 0.04);
            --accent-color: #1a73e8;
            --danger-color: #d93025;
            --radius: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: rgba(30, 31, 34, 0.96);
                --text-color: #e8eaed;
                --border-color: rgba(255, 255, 255, 0.1);
                --hover-bg: rgba(255, 255, 255, 0.06);
            }
        }

        body {
            font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .container {
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: var(--radius);
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(25px);
            position: relative;
        }

        /* 状态屏模式：空闲时显示 */
        #statusScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .pulse {
            width: 80px;
            height: 80px;
            background: rgba(26, 115, 232, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(26, 115, 232, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(26, 115, 232, 0); }
        }

        /* 授权请求模式：隐藏状态屏 */
        #promptScreen {
            display: none;
            flex-direction: column;
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
        }

        .header {
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: rgba(26, 115, 232, 0.08);
            padding: 16px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .prompt-box pre {
            white-space: pre-wrap;
            font-family: 'Cascadia Code', Consolas, monospace;
            margin: 10px 0 0 0;
            color: var(--accent-color);
            font-weight: 600;
        }

        .btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
        }

        .btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .btn-danger {
            margin-top: auto;
            border-color: rgba(217, 48, 37, 0.3);
        }

        .btn-danger:hover {
            background: rgba(217, 48, 37, 0.1);
            color: var(--danger-color);
        }

        .close-hint {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 12px;
            opacity: 0.5;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        #warningBox {
            display: none;
            background: rgba(244, 180, 0, 0.12);
            border-left: 4px solid #f4b400;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12px;
            border-radius: 6px;
            color: #b07d00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="close-hint" onclick="hideWindow()">点击此处最小化</div>

        <!-- 状态屏：正常待机 -->
        <div id="statusScreen">
            <div class="pulse">🤖</div>
            <h3 style="margin:0">HeyBuddy Active</h3>
            <p style="font-size:12px; opacity:0.6">正在监听端口 19999...<br>您可以最小化此窗口</p>
            <button class="btn" style="width: auto; margin-top:20px" onclick="hideWindow()">最小化到任务栏</button>
        </div>

        <!-- 授权屏：有任务时切换 -->
        <div id="promptScreen">
            <div class="header">🚀 HeyBuddy 授权拦截</div>
            
            <div id="warningBox">
                <b>⚠️ 编辑器权限请求：</b>您刚才选择了“使用编辑器修改”，现正请求运行编辑器。请点击 <b>[仅允许本次]</b> 即可。
            </div>

            <div class="prompt-box">
                <b>系统提示：</b>
                <pre id="promptMsg">-</pre>
                <div style="margin-top: 10px; font-size: 11px; opacity: 0.6;">
                    <b>Tool:</b> <span id="toolName">-</span>
                </div>
            </div>

            <button class="btn" onclick="makeChoice('ALLOW')">✅ <b style="margin:0 8px">仅允许本次</b> (Allow once)</button>
            <button class="btn" onclick="makeChoice('SESSION')">🕒 <b style="margin:0 8px">本会话均允许</b> (Allow session)</button>
            <button class="btn" onclick="makeChoice('MANUAL')">💻 <b style="margin:0 8px">回到CLI手动操作</b> (Manual)</button>
            <button class="btn btn-danger" onclick="makeChoice('CANCEL')">❌ <b style="margin:0 8px">拒绝并返回</b> (Cancel)</button>
        </div>
    </div>

    <script>
        const statusScreen = document.getElementById('statusScreen');
        const promptScreen = document.getElementById('promptScreen');

        function hideWindow() {
            window.api.sendChoice('IDLE'); // 自定义信号，仅用于隐藏不回复 HTTP
        }

        function makeChoice(choice) {
            statusScreen.style.display = 'flex';
            promptScreen.style.display = 'none';
            window.api.sendChoice(choice);
        }

        window.api.onShowPrompt((data) => {
            document.getElementById('promptMsg').textContent = data.msg;
            document.getElementById('toolName').textContent = data.tool;
            
            statusScreen.style.display = 'none';
            promptScreen.style.display = 'flex';

            const warningBox = document.getElementById('warningBox');
            if (data.tool === 'run_shell_command' && (data.msg.includes('vim') || data.msg.includes('nano'))) {
                warningBox.style.display = 'block';
            } else {
                warningBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
